<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	
<head>
	<meta charset="UTF-8">
	<title>タスク編集</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="edit_body">
	
 <div class="container">
	<h1>タスク編集</h1>
	<form th:action="@{/tasks/update}" th:object="${task}" method="post">
		<input type="hidden" th:field="*{id}">
		
		<div class="form-group">
			<label>タイトル</label>
			<input type="text" th:field="*{title}" placeholder="例：買い物リスト作成">
		</div>
		
		<div class="form-group">
			<label>内容</label>
			<textarea th:field="*{content}" rows="4"></textarea>
		</div>
		
		<div class="form-group">
			<label>登録者</label>
			<input type="text" th:field="*{name}">
		</div>
		
		<div class="form-group">
			<label>開始日</label>
			<input type="date" th:field="*{startDate}">
		</div>
		
		<div class="form-group">
			<label>終了日</label>
			<input type="date" th:field="*{endDate}">
		</div>
		
		<div>
		<button type="submit" class="btn-update">更新</button>
		<a th:href="@{/tasks}" class="btn-cancel">←キャンセル</a>
		</div>
	</form>
	</div>
</body>

</html>
